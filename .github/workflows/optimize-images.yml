name: Optimize image assets

on:
  push:
    paths:
      - ".github/workflows/optimize-images.yml"

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Optimize images and generate WebP variants
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import json, os, shutil

          root = Path("assets")

          # Remove/rename legacy filenames with spaces or ChatGPT.
          duplicate = root / "ChatGPT Image Sep 22, 2026, 06_14_03 PM.png"
          if duplicate.exists():
              duplicate.unlink()

          renames = {
              "ChatGPT Image Sep 22, 2026, 06_56_26 PM.png": "vending-product-reference-1.png",
              "58b66a32-cd3b-4688-997b-f3bd7b579930(1) (2).png": "vending-product-reference-2.png",
          }
          for old, new in renames.items():
              src, dst = root / old, root / new
              if src.exists() and not dst.exists():
                  src.rename(dst)

          manifest = {}
          for path in sorted(root.iterdir()):
              if path.suffix.lower() not in {".png",".jpg",".jpeg",".webp"}:
                  continue
              try:
                  with Image.open(path) as im:
                      manifest[path.name] = {"width": im.width, "height": im.height}
                      fmt = path.suffix.lower()
                      if fmt == ".png":
                          im.save(path, format="PNG", optimize=True, compress_level=9)
                          if path.stat().st_size >= 300_000:
                              webp = path.with_suffix(".webp")
                              save_im = im.convert("RGBA") if im.mode in ("RGBA","LA","P") else im.convert("RGB")
                              save_im.save(webp, format="WEBP", quality=82, method=6)
                              manifest[webp.name] = {"width": im.width, "height": im.height}
                      elif fmt in {".jpg",".jpeg"}:
                          rgb = im.convert("RGB")
                          rgb.save(path, format="JPEG", quality=82, optimize=True, progressive=True)
                      elif fmt == ".webp":
                          save_im = im.convert("RGBA") if im.mode in ("RGBA","LA","P") else im.convert("RGB")
                          save_im.save(path, format="WEBP", quality=82, method=6)
              except Exception as exc:
                  print(f"Skipping {path}: {exc}")

          (root / "image-dimensions.json").write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n")
          PY
      - name: Commit optimized assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "No image changes."
          else
            git commit -m "Optimize image assets"
            git push
          fi
